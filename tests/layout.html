<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell layout tests</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.45 system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 820px; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #sum { font-weight: 600; margin: 0 0 16px; }
  #sum.ok { color: #1a7f37; } #sum.bad { color: #cf222e; }
  table { border-collapse: collapse; width: 100%; }
  td { border-bottom: 1px solid #8884; padding: 5px 8px; vertical-align: top; }
  td:first-child { width: 4.5em; font-weight: 600; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; }
  .detail { font: 12px ui-monospace, monospace; opacity: .8; white-space: pre-wrap; }
  iframe { position: fixed; left: -9999px; top: 0; width: 1300px; height: 900px; border: 0; }
  button { font: inherit; padding: 4px 12px; }
</style>
</head>
<body>
<h1>Inkwell layout tests</h1>
<p>Drives the app in a hidden frame (its own storage, your documents are untouched) and checks the page layout: no overlapping text, nothing outside a page, headings kept with their text, wrappers cleaned up.</p>
<p><button id="run">Run again</button></p>
<p id="sum">Running…</p>
<table id="out"></table>
<iframe id="app" src="../index.html?test" title="Inkwell under test"></iframe>
<script>
const frame = document.getElementById('app');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let W, D, ed, page;

const lorem = (n) => Array.from({ length: n }, (_, i) => `Lorem ${i} ipsum dolor sit amet consectetur`).join(' ');
const svg = (w, h) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#c33"/></svg>`);
const B = '1px solid #000';

async function boot() {
  await new Promise((res) => { if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentDocument.querySelector('#editor')) res(); else frame.onload = res; });
  W = frame.contentWindow; D = frame.contentDocument;
  for (let i = 0; i < 40 && !D.querySelector('.sheets .sheet'); i++) await sleep(100);
  ed = D.querySelector('#editor'); page = ed.parentElement;
}
const sheetsEl = () => page.querySelector('.sheets');
const pageH = () => Math.round(page.getBoundingClientRect().height);

async function settle() {
  let last = -1, same = 0;
  for (let i = 0; i < 40 && same < 3; i++) { await sleep(200); const h = pageH() + '/' + ed.querySelectorAll('.pgs-part').length; same = h === last ? same + 1 : 0; last = h; }
}
async function load(html, cols = 1) {
  ed.innerHTML = html;
  ed.dispatchEvent(new Event('input', { bubbles: true }));
  await setCols(cols);
}
async function setCols(n) {
  D.querySelector(`#m-cols [data-val="${n}"]`).click();
  await settle();
}

// ---- measurements -------------------------------------------------------
function textRects() {
  const out = [], w = D.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentElement;
    if (p.closest('.textbox, td table, [contenteditable="false"]')) continue;
    const r = D.createRange(); r.selectNodeContents(n);
    for (const q of r.getClientRects()) if (q.width > 1 && q.height > 3) out.push({ l: q.left, r: q.right, t: q.top, b: q.bottom, n });
  }
  return out;
}
function overlaps(rs) {
  const s = [...rs].sort((a, b) => a.t - b.t), bad = [];
  for (let i = 0; i < s.length; i++) {
    for (let j = i + 1; j < s.length && s[j].t < s[i].b; j++) {
      const a = s[i], b = s[j];
      const ow = Math.min(a.r, b.r) - Math.max(a.l, b.l), oh = Math.min(a.b, b.b) - Math.max(a.t, b.t);
      if (ow > 3 && oh > 0.45 * Math.min(a.b - a.t, b.b - b.t)) bad.push(`"${a.n.nodeValue.slice(0, 18)}" over "${b.n.nodeValue.slice(0, 18)}"`);
    }
  }
  return bad;
}
function outside(rs) {
  const sh = [...sheetsEl().children].map((s) => s.getBoundingClientRect());
  return rs.filter((q) => !sh.some((s) => q.t >= s.top - 1 && q.b <= s.bottom + 1 && q.l >= s.left - 1 && q.r <= s.right + 1)).map((q) => `"${q.n.nodeValue.slice(0, 20)}" at y=${Math.round(q.t)}`);
}
function orphanHeadings() {
  const out = [];
  ed.querySelectorAll('h1,h2,h3').forEach((h) => {
    const n = h.nextElementSibling; if (!n) return;
    const a = h.getBoundingClientRect(), b = n.getBoundingClientRect();
    if (b.top < a.top - 1 || Math.abs(b.left - a.left) > 5 || b.top - a.bottom > 150) out.push(h.textContent);
  });
  return out;
}
const sheetCount = () => sheetsEl().children.length;
const bodyMax = () => Math.max(...[...sheetsEl().children].map((s) => s.getBoundingClientRect().height));

// ---- fixtures -----------------------------------------------------------
const longText = () => Array.from({ length: 30 }, (_, i) => `<p>${lorem(30 + (i % 5) * 20)}</p>`).join('');
const headings = () => Array.from({ length: 40 }, (_, i) => `<h2>Heading ${i}</h2><p>${lorem(8 + (i % 4) * 8)}</p>`).join('');
const tallRow = (n) => `<table style="width:100%;border-collapse:collapse"><tbody><tr><td style="border:${B};background:#eef">a</td><td style="border:${B};background:#fee">${Array.from({ length: n }, (_, i) => `line ${i} lorem ipsum dolor`).join(' ')}</td></tr><tr><td style="border:${B}">x</td><td style="border:${B}">y</td></tr></tbody></table>`;
const shortRows = (n) => `<table style="width:100%;border-collapse:collapse"><tbody>${Array.from({ length: n }, (_, i) => `<tr><td style="border:${B}">r${i}</td><td style="border:${B}">cell ${i}</td></tr>`).join('')}</tbody></table>`;

// ---- tests --------------------------------------------------------------
const clean = (name, html, cols, opts = {}) => ({
  name,
  async run() {
    await load(html(), cols);
    const rs = textRects(), f = [];
    if (opts.pages) { if (sheetCount() < opts.pages) f.push(`expected at least ${opts.pages} pages, got ${sheetCount()}`); }
    if (opts.parts && !ed.querySelector('.pgs-part')) f.push('expected the text to be split into column parts');
    f.push(...overlaps(rs).slice(0, 3).map((x) => 'overlap: ' + x), ...outside(rs).slice(0, 3).map((x) => 'outside page: ' + x));
    return { fail: f, info: `${sheetCount()} pages, ${rs.length} lines` };
  },
});

const tests = [
  { name: 'Short document is one page with no wrappers', async run() {
    await load('<p>Hello</p><p>World</p>', 1);
    const f = []; if (sheetCount() !== 1) f.push('pages: ' + sheetCount()); if (ed.querySelector('.pgs-part')) f.push('unexpected column parts');
    return { fail: f, info: `${sheetCount()} page` };
  } },
  clean('Long text, 1 column', longText, 1, { pages: 2 }),
  clean('Long text, 2 columns', longText, 2, { pages: 2, parts: true }),
  clean('Long text, 3 columns', longText, 3, { parts: true }),
  clean('Tall table row, 1 column', () => `<p>intro</p>${tallRow(150)}<p>tail</p>`, 1, { pages: 3 }),
  clean('Tall table row, 2 columns', () => `<p>intro</p>${tallRow(150)}<p>tail</p>`, 2, { parts: true }),
  clean('Tall table row, 3 columns', () => `<p>intro</p>${shortRows(40)}${tallRow(120)}<p>${lorem(200)}</p>`, 3, { parts: true }),
  { name: 'Split row draws continuation cells in columns', async run() {
    await load(`<p>intro</p>${tallRow(150)}<p>tail</p>`, 2);
    const n = D.querySelectorAll('.sheets')[1].children.length;
    return { fail: n < 4 ? [`only ${n} cell boxes drawn`] : [], info: `${n} boxes` };
  } },
  ...[1, 2, 3].map((c) => ({ name: `Headings are never stranded, ${c} column${c > 1 ? 's' : ''}`, async run() {
    await load(headings(), c);
    const o = orphanHeadings();
    return { fail: o.map((h) => 'stranded: ' + h), info: `${ed.querySelectorAll('h2').length} headings` };
  } })),
  { name: 'Pictures, shapes and charts are capped to a page', async run() {
    await load(`<p>a</p><table style="width:100%;border-collapse:collapse"><tbody><tr><td style="border:${B}"><img src="${svg(300, 3000)}" width="300" height="3000"></td><td style="border:${B}"><img src="${svg(300, 2500)}" width="300" height="2500"></td></tr></tbody></table><div class="shape shape-round" contenteditable="false" style="width:200px;height:3000px"></div><img src="${svg(400, 4000)}" width="400" height="4000"><p>end</p>`, 1);
    const lim = bodyMax(), f = [];
    ed.querySelectorAll('img,.shape').forEach((e, i) => { const h = e.getBoundingClientRect().height; if (h > lim) f.push(`item ${i} is ${Math.round(h)}px, page is ${Math.round(lim)}px`); });
    const row = ed.querySelector('tr').getBoundingClientRect().height; if (row > lim) f.push(`picture row is ${Math.round(row)}px`);
    return { fail: f, info: `page ${Math.round(lim)}px` };
  } },
  ...[1, 2].map((c) => ({ name: `Text box and nested table are capped, ${c} column${c > 1 ? 's' : ''}`, async run() {
    const nested = '<table style="border-collapse:collapse"><tbody>' + Array.from({ length: 120 }, (_, i) => `<tr><td style="border:${B}">n${i}</td></tr>`).join('') + '</tbody></table>';
    const box = '<div class="textbox" style="width:260px">' + Array.from({ length: 150 }, (_, i) => `<p>box line ${i}</p>`).join('') + '</div>';
    await load(`<p>intro</p><table style="width:100%;border-collapse:collapse"><tbody><tr><td style="border:${B}">${nested}</td><td style="border:${B}">side</td></tr></tbody></table><p>between</p>${box}<p>tail</p>`, c);
    const lim = bodyMax(), f = [];
    const bx = ed.querySelector('.textbox').getBoundingClientRect(), rw = ed.querySelector('tr').getBoundingClientRect();
    if (bx.height > lim) f.push(`text box ${Math.round(bx.height)}px > page ${Math.round(lim)}px`);
    if (rw.height > lim) f.push(`nested row ${Math.round(rw.height)}px > page ${Math.round(lim)}px`);
    const tail = [...ed.querySelectorAll('p')].pop().getBoundingClientRect();
    if (tail.top < bx.bottom - 1 && Math.abs(tail.left - bx.left) < bx.width) f.push('tail paragraph overlaps the text box');
    return { fail: f, info: `box ${Math.round(bx.height)}px, row ${Math.round(rw.height)}px` };
  } })),
  { name: 'Table of figures lists captions with page numbers', async run() {
    const cap = (k, x) => `<p class="caption"><span class="cap-num" data-cap="${k}" contenteditable="false">${k} 1</span>: ${x}</p>`;
    await load(`<h1>Intro</h1><div class="toc" data-kind="Figure"></div>${cap('Figure', 'Sales')}<p>${lorem(1500)}</p>${cap('Table', 'Costs')}${cap('Figure', 'Growth')}<p>end</p>`, 1);
    const rows = [...ed.querySelectorAll('.toc [data-i]')].map((r) => r.textContent), f = [];
    if (rows.length !== 2) f.push('expected 2 rows, got ' + rows.length);
    else {
      if (!/^Figure 1: Sales1$/.test(rows[0])) f.push('row 1: ' + rows[0]);
      if (!/^Figure 2: Growth(\d+)$/.test(rows[1]) || Number(rows[1].match(/(\d+)$/)[1]) < 2) f.push('row 2: ' + rows[1]);
    }
    return { fail: f, info: rows.join(' | ') };
  } },
  { name: 'Compare marks word edits, added and removed paragraphs', async run() {
    const { diffHtml } = await import('../js/compare.js?t=' + Date.now());
    const old = '<h1>Report</h1><p>Sales rose by ten percent this year.</p><p>We will hire two people.</p><p>Gone entirely now.</p>';
    const cur = '<h1>Report</h1><p>Sales rose by twelve percent this year.</p><p>We will hire three people and a manager.</p><p>Brand new note.</p>';
    const r = diffHtml(old, cur), f = [];
    const box = document.createElement('div'); box.innerHTML = r.html;
    const txt = (s) => [...box.querySelectorAll(s)].map((x) => x.textContent).join('|');
    if (txt('del.tc').indexOf('ten') < 0 || txt('ins.tc').indexOf('twelve') < 0) f.push('word edit not marked: ' + r.html);
    if (box.querySelector('p').nextElementSibling.querySelector('del.tc') && box.querySelectorAll('p')[0].textContent.indexOf('Sales rose by') < 0) f.push('edited paragraph lost its text');
    if (r.stats.edited < 1) f.push('no edited paragraphs: ' + JSON.stringify(r.stats));
    if (r.stats.added + r.stats.removed < 2) f.push('adds/removes not counted: ' + JSON.stringify(r.stats));
    if (!/Gone entirely now/.test(txt('del.tc'))) f.push('removed paragraph missing');
    if (!/Brand new note/.test(txt('ins.tc'))) f.push('added paragraph missing');
    const same = diffHtml(cur, cur);
    if (same.changes || same.html.indexOf('class="tc"') >= 0) f.push('identical documents reported changes');
    return { fail: f, info: JSON.stringify(r.stats) };
  } },
  { name: 'Accessibility checker finds missing alt text, skipped headings, vague links, header-less tables and low contrast', async run() {
    const { check } = await import('../js/access.js?t=' + Date.now());
    const box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:-9999px;background:#fff';
    box.innerHTML = '<h2>A</h2><h4>B</h4><p>x <a href="#">click here</a> <span style="color:#bbbbbb">pale</span> <span style="color:#222222">dark</span></p><p><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt=""></p><table><tr><td>a</td></tr><tr><td>b</td></tr></table>';
    document.body.append(box);
    const got = check(box).map((i) => i.rule + ':' + i.sev).sort().join(' '), f = [];
    box.remove();
    for (const want of ['alt:error', 'heading:warn', 'link:warn', 'table:warn', 'contrast:error']) if (!got.includes(want)) f.push('missing ' + want + ' in ' + got);
    if ((got.match(/contrast/g) || []).length !== 1) f.push('expected exactly one contrast issue: ' + got);
    return { fail: f, info: got };
  } },
  { name: 'Word charts survive an export and re-import as editable charts', async run() {
    const { exportDocx, loadScript } = await import('../js/docx.js?t=' + Date.now());
    const { prepare } = await import('../js/docximport.js?t=' + Date.now());
    const cfgs = ['column', 'stacked', 'bar', 'line', 'area', 'combo', 'scatter', 'radar', 'pie', 'donut'].map((type, i) => ({ type, title: 'T' + i, labels: type === 'scatter' ? ['1', '2.5', '4'] : ['a', 'b', 'c'], series: [{ name: 'S1', values: [1, 3, 2.5] }, ...(type === 'pie' || type === 'donut' ? [] : [{ name: 'S2', values: [2, 2, 4] }])] }));
    cfgs.push(
      { type: 'bubble', title: 'B', labels: ['1', '2.5', '4'], series: [{ name: 'Y1', values: [1, 3, 2.5] }, { name: 'Y1 (size)', values: [10, 40, 5] }, { name: 'Y2', values: [2, 2, 4] }], dataLabels: true, catTitle: 'Age', valTitle: 'Pay' },
      { type: 'combo', title: 'Sec', labels: ['a', 'b', 'c'], series: [{ name: 'Revenue', values: [100, 300, 250] }, { name: 'Margin', values: [0.2, 0.35, 0.3] }], secondary: true, catTitle: 'Q', valTitle: 'Money', secTitle: 'Percent' });
    cfgs.push(
      { type: 'stacked100', title: 'P', labels: ['a', 'b', 'c'], series: [{ name: 'S1', values: [1, 3, 2.5] }, { name: 'S2', values: [2, 2, 4] }], dataLabels: true, catTitle: 'Region', valTitle: 'Share' },
      { type: 'column', title: 'L', labels: ['a', 'b', 'c'], series: [{ name: 'S1', values: [1, 3, 2.5] }, { name: 'S2', values: [2, 2, 4] }], dataLabels: true },
      { type: 'bar', title: '', labels: ['a', 'b', 'c'], series: [{ name: 'S1', values: [1, 3, 2.5] }, { name: 'S2', values: [2, 2, 4] }], catTitle: 'Team', valTitle: 'Hours' },
      { type: 'scatter', title: 'X', labels: ['1', '2.5', '4'], series: [{ name: 'S1', values: [1, 3, 2.5] }, { name: 'S2', values: [2, 2, 4] }], catTitle: 'Dose', valTitle: 'Response' },
      { type: 'pie', title: 'Pie', labels: ['a', 'b', 'c'], series: [{ name: 'S1', values: [1, 3, 2.5] }], dataLabels: true });
    // the renderer must draw the new options without error
    const { renderChart } = await import('../js/objects.js?t=' + Date.now());
    const drawn = cfgs.slice(-5).map((c) => renderChart(c)), fx = [];
    if (!/100%/.test(drawn[0]) || !/Region/.test(drawn[0]) || !/Share/.test(drawn[0])) fx.push('100% stacked chart lacks % axis or axis titles');
    if (!/font-size="10"[^>]*>2\.5<\/text>/.test(drawn[1])) fx.push('data labels not drawn');
    if (!/Hours/.test(drawn[2]) || !/Team/.test(drawn[2])) fx.push('bar axis titles missing');
    if (!/%<\/text>/.test(drawn[4])) fx.push('pie data labels missing');
    const bubSvg = renderChart(cfgs[cfgs.length - 7]), secSvg = renderChart(cfgs[cfgs.length - 6]);
    const radii = [...bubSvg.matchAll(/<circle[^>]* r="([\d.]+)"/g)].map((m) => +m[1]);
    if (radii.length !== 6 || Math.max(...radii) <= Math.min(...radii)) fx.push('bubble sizes not drawn: ' + radii);
    if (!/Percent/.test(secSvg) || !/rotate\(90\)/.test(secSvg) || !/>0\.4<\/text>|>0\.35<\/text>/.test(secSvg)) fx.push('secondary axis title or ticks missing');
    if (/>0\.4<\/text>/.test(renderChart({ ...cfgs[cfgs.length - 6], secondary: false }))) fx.push('secondary axis drawn when off');
    const root = document.createElement('div');
    root.innerHTML = '<p>Hello</p>' + cfgs.map((c) => `<figure class="chart" data-chart='${JSON.stringify(c)}'></figure>`).join('') + '<p>End</p>';
    const JSZip = await loadScript('../vendor/jszip.min.js', 'JSZip'), mammoth = await loadScript('../vendor/mammoth.browser.min.js', 'mammoth');
    const blob = await exportDocx(root, { title: 't', page: { w: 210, h: 297, m: { t: 25, r: 25, b: 25, l: 25 } } });
    const rich = await prepare(JSZip, await blob.arrayBuffer());
    const box = document.createElement('div');
    box.innerHTML = rich.finish((await mammoth.convertToHtml({ arrayBuffer: rich.buffer })).value);
    const got = [...box.querySelectorAll('figure.chart')].map((x) => JSON.parse(x.dataset.chart)), f = [...fx];
    if (got.length !== cfgs.length) f.push(`expected ${cfgs.length} charts, got ${got.length}`);
    cfgs.forEach((c, i) => { if (JSON.stringify(c) !== JSON.stringify(got[i])) f.push(`${c.type} changed: ${JSON.stringify(got[i])}`); });
    return { fail: f, info: got.length + ' charts' };
  } },
  { name: 'SmartArt is exported as native Word diagram parts and re-imports as editable SmartArt', async run() {
    const { exportDocx, loadScript } = await import('../js/docx.js?t=' + Date.now());
    const { prepare } = await import('../js/docximport.js?t=' + Date.now());
    const cfgs = [{ kind: 'process', items: ['Plan', 'Build & test', 'Launch'] }, { kind: 'cycle', items: ['Plan', 'Do', 'Check', 'Act'] }, { kind: 'hierarchy', items: ['Director', 'Design', 'Engineering', 'Sales'] }, { kind: 'list', items: ['Goals', 'Milestones'] }, { kind: 'pyramid', items: ['Vision', 'Strategy', 'Tactics', 'Daily work'] }];
    const root = document.createElement('div');
    root.innerHTML = '<p>Hello</p>' + cfgs.map((c) => `<figure class="smartart" data-sa='${JSON.stringify(c).replace(/'/g, '&#39;')}'></figure>`).join('') + '<p>End</p>';
    const JSZip = await loadScript('../vendor/jszip.min.js', 'JSZip'), mammoth = await loadScript('../vendor/mammoth.browser.min.js', 'mammoth');
    const blob = await exportDocx(root, { title: 't', page: { w: 210, h: 297, m: { t: 25, r: 25, b: 25, l: 25 } } });
    const buf = await blob.arrayBuffer(), zip = await JSZip.loadAsync(buf), f = [];
    const names = Object.keys(zip.files);
    for (let i = 1; i <= cfgs.length; i++) for (const n of ['data', 'layout', 'quickStyle', 'colors', 'drawing']) {
      const file = `word/diagrams/${n}${i}.xml`;
      if (!names.includes(file)) { f.push('missing ' + file); continue; }
      const d = new DOMParser().parseFromString(await zip.file(file).async('string'), 'application/xml');
      if (d.getElementsByTagName('parsererror').length) f.push(file + ' is not well-formed');
    }
    const ct = await zip.file('[Content_Types].xml').async('string'), rels = await zip.file('word/_rels/document.xml.rels').async('string'), doc = await zip.file('word/document.xml').async('string');
    for (const t of ['diagramData+xml', 'diagramLayout+xml', 'diagramStyle+xml', 'diagramColors+xml', 'diagramDrawing+xml']) if (!ct.includes(t)) f.push('no content type ' + t);
    for (const t of ['/diagramData"', '/diagramLayout"', '/diagramQuickStyle"', '/diagramColors"', '/diagramDrawing"']) if (!rels.includes(t)) f.push('no relationship ' + t);
    if ((doc.match(/<dgm:relIds/g) || []).length !== cfgs.length) f.push('expected ' + cfgs.length + ' diagrams in the document');
    if (/word\/media\//.test(names.join())) f.push('SmartArt is still written as a picture');
    const data1 = await zip.file('word/diagrams/data1.xml').async('string'), m = data1.match(/relId="(rId\d+)"/);
    if (!m || !rels.includes(`Id="${m[1]}"`) || !new RegExp(`Id="${m[1]}"[^>]*diagramDrawing|diagramDrawing"[^>]*Id="${m[1]}"|Id="${m[1]}" Type="[^"]*diagramDrawing`).test(rels)) f.push('data model does not point at its drawing part');
    const rich = await prepare(JSZip, buf), box = document.createElement('div');
    box.innerHTML = rich.finish((await mammoth.convertToHtml({ arrayBuffer: rich.buffer })).value);
    const got = [...box.querySelectorAll('figure.smartart')].map((x) => JSON.parse(x.dataset.sa));
    if (got.length !== cfgs.length) f.push(`expected ${cfgs.length} diagrams, got ${got.length}`);
    cfgs.forEach((c, i) => { if (JSON.stringify(c) !== JSON.stringify(got[i])) f.push(`${c.kind} changed: ${JSON.stringify(got[i])}`); });
    return { fail: f, info: got.length + ' diagrams' };
  } },
  { name: 'Compare marks removed table rows and cells, and added, removed and replaced pictures', async run() {
    const { diffHtml } = await import('../js/compare.js?t=' + Date.now());
    const I = (c) => `<img src="data:image/png;base64,${c}" alt="">`, A = I('AAAA'), B = I('BBBB'), C = I('CCCC');
    const old = `<p>Intro text here.</p><table><tr><td>Apples</td><td>10</td></tr><tr><td>Pears</td><td>20</td></tr><tr><td>Plums</td><td>30</td></tr></table><p>${A}</p><p>Photo caption words.</p><p>Chart ${B} below</p><p>${C}</p>`;
    const cur = `<p>Intro text here.</p><table><tr><td>Apples</td><td>10</td></tr><tr><td>Plums</td><td>35</td></tr></table><p>${B}</p><p>Photo caption words.</p><p>Chart below</p><p>${C}</p><p>${A}</p>`;
    const r = diffHtml(old, cur), f = [];

    const r = diffHtml(oldH, newH), f = [];
    await load(r.html);
    const q = (sel) => [...ed.querySelectorAll(sel)];
    const note = (id) => ed.querySelector(`ol.footnotes li[data-fn="${id}"]`);
    if (!note('a') || !note('a').querySelector('del.tc') || !note('a').querySelector('ins.tc')) f.push('the edited note text was not marked');
    if (note('a') && !/1999/.test(note('a').querySelector('del.tc')?.textContent || '')) f.push('old note wording not shown as deleted');
    const nn = note('n');
    if (!nn || !nn.querySelector('ins.tc')) f.push('the added note was not marked as inserted');
    if (!q('ins.tc').some((x) => x.querySelector('sup.fn-ref[data-fn="n"]'))) f.push('the reference to the added note was not marked as inserted');
    if (!q('del.tc').some((x) => x.querySelector('sup.fn-ref'))) f.push('the reference to the removed note was not shown as deleted');
    if (!q('ol.footnotes li del.tc').some((x) => /deleted/.test(x.textContent))) f.push('the removed note is missing from the list');
    const c1 = ed.querySelector('span.cm[data-cm="c1"]');
    if (!c1 || !/was “Check this”/.test(c1.dataset.text)) f.push('the changed comment does not carry the old text: ' + (c1 && c1.dataset.text));
    const gone = q('span.cm').find((x) => /Deleted comment by Sam: Remove me/.test(x.dataset.text));
    if (!gone || gone.textContent !== 'doomed words') f.push('the removed comment did not come back on its words');
    if (!ed.querySelector('span.cm[data-cm="c3"]')) f.push('the added comment was lost');
    if (r.stats.unmarked) f.push(r.stats.unmarked + ' changes unmarked');
    // rejecting every change must give back the old notes
    D.querySelector('[data-cmd="rejectAll"]').click();
    await sleep(250);
    const left = [...ed.querySelectorAll('ol.footnotes li')].map((li) => li.textContent.trim());
    if (left.length !== 2) f.push('after rejecting there are ' + left.length + ' notes, expected 2: ' + JSON.stringify(left));
    else if (!/1999/.test(left[0]) || !/deleted/.test(left[1])) f.push('rejected notes read ' + JSON.stringify(left));
    return { fail: f, info: JSON.stringify(r.stats) };
  } },
  { name: 'PDF export has one page per layout page, real text, links and bookmarks', async run() {
    await load(`<h1>Heading one</h1><p>Visit <a href="https://example.com/x">our site</a> and <b>read</b> this.</p><p>${lorem(1200)}</p><h2>Second</h2><p>${lorem(300)}</p>`, 1);
    const pdf = await W.eval(`import('${new URL('../js/pdf.js', location.href).href}')`), pages = (await W.eval(`import('${new URL('../js/pages.js', location.href).href}')`)).count();
    const r = await pdf.buildPdf(), f = [];
    const txt = new TextDecoder('latin1').decode(new Uint8Array(await r.blob.arrayBuffer()));
    if (!txt.startsWith('%PDF-') || !/%%EOF\s*$/.test(txt)) f.push('not a well-formed file');
    if (r.pages !== pages) f.push(`${r.pages} PDF pages for ${pages} layout pages`);
    if ((txt.match(/\/Type \/Page /g) || []).length !== pages) f.push('page objects do not match');
    if (txt.indexOf('/URI (https://example.com/x)') < 0) f.push('link annotation missing');
    if (txt.indexOf('/Outlines') < 0) f.push('bookmarks missing');
    if (pages < 2) f.push('test document did not span pages');
    return { fail: f, info: `${r.pages} pages, ${Math.round(r.blob.size / 1024)} KB` };
  } },
  { name: 'Back to 1 column removes every temporary wrapper', async run() {
    await load(longText(), 2); await setCols(1);
    const n = ed.querySelectorAll('.pgs-part').length;
    return { fail: n ? [`${n} wrappers left`] : [], info: 'clean' };
  } },
];

async function runAll() {
  const out = document.getElementById('out'), sum = document.getElementById('sum');
  out.innerHTML = ''; sum.className = ''; sum.textContent = 'Running…';
  let pass = 0; window.__results = [];
  await boot();
  for (const t of tests) {
    const tr = out.insertRow(); tr.insertCell().textContent = '…'; tr.insertCell().textContent = t.name;
    let res;
    try { res = await t.run(); } catch (e) { res = { fail: ['threw: ' + e.message], info: '' }; }
    const ok = !res.fail.length; if (ok) pass++;
    tr.cells[0].textContent = ok ? 'pass' : 'FAIL'; tr.cells[0].className = ok ? 'pass' : 'fail';
    const d = document.createElement('div'); d.className = 'detail'; d.textContent = ok ? res.info : res.fail.join('\n');
    tr.cells[1].append(d);
    window.__results.push({ name: t.name, ok, detail: ok ? res.info : res.fail });
  }
  const all = pass === tests.length;
  sum.textContent = `${pass} of ${tests.length} passed`; sum.className = all ? 'ok' : 'bad';
  document.title = (all ? 'PASS' : 'FAIL') + ' · Inkwell layout tests';
  window.__done = true;
}
document.getElementById('run').onclick = () => { window.__done = false; runAll(); };
runAll();
</script>
